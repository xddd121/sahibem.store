
<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sahipem</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="123.png?v=6">
<link rel="shortcut icon" href="123.png?v=6">
<link rel="apple-touch-icon" href="123.png?v=6">

<style>

/* GENEL */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 80%),
    url("babam44.png") no-repeat center center fixed;
  background-size: cover;
}

/* NAVBAR */

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 60px;
}

/* LOGO */

.logo a {
  text-decoration: none;
  display: flex;
  align-items: center;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 1px;
  gap: 6px;
}

.logo .sahip {
  color: #fff;
}

.logo .em {
  color: #f7971f;
}

/* MENU */

.navbar ul {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 28px;
}

.navbar ul li a {
  display: inline-block;
  color: #dcdcdc;
  text-decoration: none;
  font-size: 17px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.navbar ul li a:hover {
  color: #f7971f;
  transform: translateY(-2px);
}

/* BAŞLIK */

h1 {
  color: white;
  text-align: center;
  margin-top: 40px;
  letter-spacing: 2px;
}

/* VIDEO GRID */

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 200px);
  gap: 20px;
  justify-content: center;
  margin: 40px 0;
}

.video-card {
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.video-card:hover {
  transform: scale(1.05);
  background: rgba(247,151,31,0.15);
  border-color: #f7971f;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
}

.modal.active {
  display: flex;
}

/* VIDEO */

.modal video {
  max-width: 85%;
  max-height: 85vh;
  border-radius: 8px;
}

/* HİZMETLER FOTOĞRAFI */

#imageModal img {
  max-width: 85%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
}

/* KAPATMA BUTONU */

.close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  z-index: 10000;
}

.close-btn:hover {
  color: #f7971f;
  transform: scale(1.15);
}

/* MOBİL */

@media (max-width: 700px) {

  .navbar {
    padding: 18px 20px;
    flex-direction: column;
    gap: 20px;
  }

  .navbar ul {
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .navbar ul li a {
    font-size: 15px;
  }

  h1 {
    font-size: 24px;
    margin-top: 30px;
  }

  .video-grid {
    grid-template-columns: repeat(2, 150px);
    gap: 15px;
  }

  .video-card {
    width: 150px;
    height: 150px;
  }

  .modal video,
  #imageModal img {
    max-width: 95%;
    max-height: 75vh;
  }

  .close-btn {
    top: 10px;
    right: 20px;
  }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    <a href="#">
      <span class="sahip">sahip</span>
      <span class="em">em</span>
    </a>
  </div>

  <ul>
    <li><a href="#">Ana Sayfa</a></li>
    <li><a id="servicesBtn">Hizmetler</a></li>
    <li><a href="#">Hakkımızda</a></li>
    <li><a id="contactBtn">İletişim</a></li>
  </ul>

</div>

<!-- BAŞLIK -->

<h1>KÖLE SATIŞ</h1>

<!-- VIDEO KARTLARI -->

<div class="video-grid">

  <div class="video-card" data-video="kaka1.mp4">
    köle kadın zannediyo
  </div>

  <div class="video-card" data-video="kaka3.mp4">
    köle erkeğe tapıyo
  </div>

  <div class="video-card" data-video="xdd.mp4">
    köle geridön
  </div>

</div>

<!-- VIDEO MODAL -->

<div class="modal" id="videoModal">

  <span class="close-btn" id="closeVideo">&times;</span>

  <video id="modalVideo" controls playsinline></video>

</div>

<!-- HİZMETLER FOTOĞRAF MODAL -->

<div class="modal" id="imageModal">

  <span class="close-btn" id="closeImage">&times;</span>

  <img src="kan.jpg" alt="Hizmetler" id="serviceImage">

</div>

<!-- MÜZİK -->

<audio id="bgMusic">
  <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>

// ELEMENTLER

const cards = document.querySelectorAll(".video-card");

const videoModal = document.getElementById("videoModal");
const modalVideo = document.getElementById("modalVideo");
const closeVideo = document.getElementById("closeVideo");

const contactBtn = document.getElementById("contactBtn");

const servicesBtn = document.getElementById("servicesBtn");
const imageModal = document.getElementById("imageModal");
const closeImage = document.getElementById("closeImage");

const music = document.getElementById("bgMusic");

// VIDEO AÇMA

function openVideo(src) {

  modalVideo.pause();
  modalVideo.src = src;

  videoModal.classList.add("active");

  modalVideo.load();

  modalVideo.play().catch(error => {
    console.log("Video oynatma hatası:", error);
  });

}

// VIDEO KARTLARI

cards.forEach(card => {

  card.addEventListener("click", () => {
    openVideo(card.dataset.video);
  });

});

// İLETİŞİM - BABA11

contactBtn.addEventListener("click", () => {
  openVideo("baba11.mp4");
});

// HİZMETLER - KAN.JPG

servicesBtn.addEventListener("click", () => {
  imageModal.classList.add("active");
});

// VIDEO KAPATMA

function closeVideoModal() {

  videoModal.classList.remove("active");

  modalVideo.pause();
  modalVideo.removeAttribute("src");
  modalVideo.load();

}

// FOTOĞRAF KAPATMA

function closeImageModal() {
  imageModal.classList.remove("active");
}

// X BUTONLARI

closeVideo.addEventListener("click", closeVideoModal);

closeImage.addEventListener("click", closeImageModal);

// MODAL DIŞINA TIKLAYINCA KAPAT

videoModal.addEventListener("click", (e) => {
  if (e.target === videoModal) {
    closeVideoModal();
  }
});

imageModal.addEventListener("click", (e) => {
  if (e.target === imageModal) {
    closeImageModal();
  }
});

// ESC İLE KAPAT

document.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {
    closeVideoModal();
    closeImageModal();
  }

});

// MÜZİK

music.loop = false;

document.addEventListener("click", () => {

  music.play().catch(error => {
    console.log("Müzik oynatılamadı:", error);
  });

}, { once: true });

</script>

</body>
</html>
