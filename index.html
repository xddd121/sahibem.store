
<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sahipem</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="/123.png?v=3">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  min-height: 100vh;

  background:
    radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 80%),
    url("babam44.png") no-repeat center center fixed;

  background-size: cover;
}

/* NAVBAR */

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 60px;
}

.logo a {
  text-decoration: none;
  display: flex;
  font-size: 34px;
  font-weight: 700;
  gap: 6px;
}

.logo .sahip {
  color: #fff;
}

.logo .em {
  color: #f7971f;
}

.navbar ul {
  list-style: none;
  display: flex;
  gap: 28px;
}

.navbar ul li a {
  color: #dcdcdc;
  text-decoration: none;
  font-size: 17px;
  cursor: pointer;
  transition: 0.3s;
}

.navbar ul li a:hover {
  color: #f7971f;
}

/* BAŞLIK */

h1 {
  color: white;
  text-align: center;
  margin-top: 40px;
}

/* VIDEO GRID */

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 200px);
  gap: 20px;
  justify-content: center;
  margin: 40px 0;
}

.video-card {
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(4px);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
}

.video-card:hover {
  transform: scale(1.05);
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal.active {
  display: flex;
}

.modal video {
  max-width: 80%;
  max-height: 80%;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  color: white;
  cursor: pointer;
}

/* MOBİL */

@media (max-width: 700px) {
  .navbar {
    padding: 18px 20px;
    flex-direction: column;
    gap: 20px;
  }

  .navbar ul {
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .video-grid {
    grid-template-columns: repeat(2, 150px);
  }

  .video-card {
    width: 150px;
    height: 150px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    <a href="#">
      <span class="sahip">sahip</span>
      <span class="em">em</span>
    </a>
  </div>

  <ul>
    <li><a href="#">Ana Sayfa</a></li>
    <li><a href="#">Hizmetler</a></li>
    <li><a href="#">Hakkımızda</a></li>
    <li><a id="contactBtn">İletişim</a></li>
  </ul>

</div>

<!-- BAŞLIK -->

<h1>KÖLE SATIŞ</h1>

<!-- VIDEO KARTLARI -->

<div class="video-grid">

  <div class="video-card" data-video="video1.mp4">
    köle kadın zannediyo
  </div>

  <div class="video-card" data-video="video2.mp4">
    köle erkeğe tapıyo
  </div>

  <div class="video-card" data-video="xdd.mp4">
    köle geridön
  </div>

</div>

<!-- TEK VIDEO MODAL -->

<div class="modal" id="videoModal">

  <span class="close-btn" id="closeVideo">&times;</span>

  <video id="modalVideo" controls playsinline></video>

</div>

<!-- ARKA PLAN MÜZİĞİ -->

<audio id="bgMusic">
  <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>

// ELEMENTLER

const cards = document.querySelectorAll(".video-card");

const videoModal = document.getElementById("videoModal");

const modalVideo = document.getElementById("modalVideo");

const closeVideo = document.getElementById("closeVideo");

const contactBtn = document.getElementById("contactBtn");

const music = document.getElementById("bgMusic");


// VIDEO AÇMA FONKSİYONU

function openVideo(src) {

  modalVideo.pause();

  modalVideo.src = src;

  videoModal.classList.add("active");

  modalVideo.load();

  modalVideo.play().catch(error => {
    console.log("Video oynatma hatası:", error);
  });

}


// VIDEO KARTLARI

cards.forEach(card => {

  card.addEventListener("click", () => {

    openVideo(card.dataset.video);

  });

});


// İLETİŞİM BUTONU - VIDEO4

contactBtn.addEventListener("click", () => {

  openVideo("video4.mp4");

});


// VIDEO KAPATMA

function closeModal() {

  videoModal.classList.remove("active");

  modalVideo.pause();

  modalVideo.removeAttribute("src");

  modalVideo.load();

}


// X BUTONU

closeVideo.addEventListener("click", closeModal);


// BOŞ ALANA TIKLAYINCA KAPAT

videoModal.addEventListener("click", (e) => {

  if (e.target === videoModal) {

    closeModal();

  }

});


// ESC TUŞUYLA KAPATMA

document.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {

    closeModal();

  }

});


// MÜZİK - İLK ETKİLEŞİMDE BİR KERE ÇAL

music.loop = false;

document.addEventListener("click", () => {

  music.play().catch(error => {
    console.log("Müzik oynatılamadı:", error);
  });

}, { once: true });

</script>

</body>
</html>
