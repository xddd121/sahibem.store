<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sahipem</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  background: 
    radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 80%),
    url("babam44.png") no-repeat center center fixed;
  background-size: cover;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 60px;
}

.logo a {
  text-decoration: none;
  display: flex;
  font-size: 34px;
  font-weight: 700;
  gap: 6px;
}

.logo .sahip { color: #fff; }
.logo .em { color: #f7971f; }

.navbar ul {
  list-style: none;
  display: flex;
  gap: 28px;
}

.navbar ul li a {
  color: #dcdcdc;
  text-decoration: none;
  font-size: 17px;
  cursor: pointer;
  transition: 0.3s;
}

.navbar ul li a:hover {
  color: #f7971f;
}

/* BAŞLIK */
h1 {
  color: white;
  text-align: center;
  margin-top: 40px;
}

/* VIDEO GRID */
.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 200px);
  gap: 20px;
  justify-content: center;
  margin: 40px 0;
}

.video-card {
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(4px);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
}

.video-card:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal.active {
  display: flex;
}

.modal video {
  max-width: 80%;
  max-height: 80%;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  color: white;
  cursor: pointer;
}

/* İLETİŞİM MODAL */
.contact-box {
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
}
</style>

</head>

<body>

<div class="navbar">
  <div class="logo">
    <a href="#">
      <span class="sahip">sahip</span>
      <span class="em">em</span>
    </a>
  </div>

  <ul>
    <li><a href="#">Ana Sayfa</a></li>
    <li><a href="#">Hizmetler</a></li>
    <li><a href="#">Hakkımızda</a></li>
    <li><a id="contactBtn">İletişim</a></li>
  </ul>
</div>

<h1>KÖLE SATIŞ</h1>

<div class="video-grid">
  <div class="video-card" data-video="video1.mp4">köle kadın zannediyo</div>
  <div class="video-card" data-video="video2.mp4">köle erkeğe tapıyo</div>
  <div class="video-card" data-video="xdd.mp4">köle geridön</div>
  </div>

<!-- VİDEO MODAL -->
<div class="modal" id="videoModal">
  <span class="close-btn" id="closeVideo">&times;</span>
  <video id="modalVideo" controls autoplay></video>
</div>

<!-- İLETİŞİM MODAL -->
<div class="modal" id="modal">
  <span class="close" id="closeBtn">&times;</span>

  <video id="video" controls>
    <source src="Video 4.mp4" type="video/mp4">
  </video>
</div>

<script>
// VIDEO MODAL
const cards = document.querySelectorAll(".video-card");
const videoModal = document.getElementById("videoModal");
const modalVideo = document.getElementById("modalVideo");
const closeVideo = document.getElementById("closeVideo");

const contactBtn = document.getElementById("contactBtn");

// video kartları
cards.forEach(card => {
  card.addEventListener("click", () => {
    modalVideo.src = card.dataset.video;
    videoModal.classList.add("active");
  });
});

// İLETİŞİM → video4
contactBtn.addEventListener("click", () => {
  modalVideo.src = "video4.mp4";
  videoModal.classList.add("active");
  modalVideo.play();
});

// KAPAT
closeVideo.addEventListener("click", () => {
  videoModal.classList.remove("active");
  modalVideo.pause();
  modalVideo.currentTime = 0;
});

document.addEventListener("click", () => {
  const music = document.getElementById("bgMusic");
  music.play();
}, { once: true });

window.addEventListener("load", () => {
  const music = document.getElementById("bgMusic");

  // sadece 1 kere çalsın
  music.loop = false;

  music.play().catch(() => {
    // tarayıcı engellerse sessiz fallback
    console.log("Autoplay engellendi");
  });
});

</script>

<audio id="bgMusic">
  <source src="muzik.mp3" type="audio/mpeg">
</audio>



</body>
</html>
